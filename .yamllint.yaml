extends: default

ignore:
  - .claude/worktrees/
  # An installed dependency's own YAML is not this repository's to lint, and
  # pnpm writes the lockfile, so neither is read or edited by hand.
  - web/node_modules/
  - web/pnpm-lock.yaml

rules:
  line-length:
    max: 120
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
