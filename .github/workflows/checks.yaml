name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:fmt

  golangci-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:golangci-config

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since build, example-build and test each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-vet-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task lint:vet

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules, build output and golangci-lint
        # Caches the same module and build directories as the other Go
        # jobs, plus golangci-lint's own analysis cache.
        #
        # Own cache key, like vet, build, example-build and test each have.
        # actions/cache reserves a key for whichever job saves it first, so
        # a shared key across jobs would silently drop the others' saves.
        # This job also caches the golangci-lint analysis directory the
        # other jobs don't use, which is why none of them falls back to
        # this key. The reverse holds though: falling back to a sibling
        # gives this job their module and build cache without the lint
        # directory, which is incomplete rather than wrong, and better
        # than cold.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-golangci-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task lint:golangci

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:markdown

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:yaml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:actions

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:shell

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:secrets

  # The shared reusable workflow pins addlicense itself and takes the file
  # set as complete "find" invocations, one per line. task lint:license
  # keeps the same invocation for local development, and AGENTS.md records
  # that the two are kept in step by hand. addlicense 1.2.0 skips .mts files
  # silently, so the last line checks them through a copy that ends in .ts.
  license:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-license.yaml@v0
    with:
      copyright-holder: Simon Ostendorf
      year: "2026"
      # Mirrors mise.toml's own pin, so the same addlicense runs locally
      # and in CI.
      addlicense-version: "1.2.0"
      find-commands: |
        find . -name "*.go" -not -path "./.claude/worktrees/*" -not -path "*/node_modules/*"
        find web/src -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) -not -path "*/node_modules/*" -not -path "*/dist/*"
        find web/scripts -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) -not -path "*/node_modules/*" -not -path "*/dist/*"
        find web/example -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) -not -path "*/node_modules/*" -not -path "*/dist/*"
        find web/src web/scripts -name "*.mts" | while read -r f; do o=/tmp/mts/$f.ts; mkdir -p "${o%/*}"; cp "$f" "$o"; echo "$o"; done

  renovate-config:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate-config.yaml@v0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, example-build and test each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task build

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # example:build compiles the example application, a go build run
        # just like the build job, and needs the same module and build
        # cache.
        #
        # Own key, since vet, build and test each cache a different module
        # set. A miss falls back to this job's own cache first, then to
        # the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-example-build-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-test-
      - run: task example:build

  test:
    runs-on: ubuntu-latest
    # The real PostgreSQL the tests of the database package run against. Every test
    # creates and drops a database of its own on it. The password is an obvious dummy,
    # the server lives only as long as this job. With CI set and the variable missing,
    # those tests fail instead of skipping.
    services:
      postgres:
        # Tag only: Renovate pins the manifest list digest.
        image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: govue
          POSTGRES_PASSWORD: ci-dummy-password-not-real
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govue -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOVUE_TEST_DATABASE_URL: postgres://govue:ci-dummy-password-not-real@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, build and example-build each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-test-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
      - run: task test:go

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task test:scripts

  # The one job that installs the web/ dependencies for their own sake. pnpm 11 and later
  # refuse a locked version younger than the minimum release age. The install runs code of
  # the pull request: pnpm, mise tools and dependency build scripts. So this job has no
  # write token and keeps no checkout credential. On failure it hands its log to the
  # web-deps-comment job, which explains the failure on the pull request. Never call the
  # comment action from this job and never give this job pull-requests: write.
  web-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Install the web dependencies and keep the log
        # pipefail keeps the exit code of the install, not the one of tee.
        run: |
          set -o pipefail
          task web:deps 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Keep the install log for the comment job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: install-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/install.log
          if-no-files-found: ignore
          retention-days: 1

  # The only job with a write token or a secret. It runs on a fresh runner after the install
  # job, so nothing the install did is here: no tool, no changed file, no stored credential.
  # It checks out nothing. It mints a token as the dependencies app, so the comment comes
  # from the app. This adds no new reader of the key. Any writer of any repository the org
  # secret is visible to can already read it, this repository included through
  # renovate.yaml. The condition is org wide: the owner alone has write access to every
  # repository in the secret's visibility. The lever is limiting that visibility to the
  # repositories that need the key, which belongs in the infrastructure repository. The
  # shared action downloads the log and hands the token to its own script step alone. The
  # log is data, the script reads only strictly matched text from it. A fork pull request
  # has no secret and is skipped.
  web-deps-comment:
    needs: web-deps
    if: >-
      ${{ always() && needs.web-deps.result == 'failure'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Two quick reruns must not both create the comment.
    concurrency:
      group: release-age-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # No owner and no repositories: the token is scoped to this repository only.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.GH_APP_DEPENDENCIES_PRIVATE_KEY }}
          permission-pull-requests: write
      - uses: ostendorf-cloud/workflows/.github/actions/pnpm-release-age-comment@v0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          comment-author: ostendorf-cloud-dependencies[bot]
          artifact-name: install-log-${{ github.run_attempt }}

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:lint

  web-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:format

  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:types

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:e2e
