name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:fmt

  golangci-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:golangci-config

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since build, example-build and test each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-vet-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task lint:vet

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Cache Go modules, build output and golangci-lint
        # Caches the same module and build directories as the other Go
        # jobs, plus golangci-lint's own analysis cache.
        #
        # Own cache key, like vet, build, example-build and test each have.
        # actions/cache reserves a key for whichever job saves it first, so
        # a shared key across jobs would silently drop the others' saves.
        # This job also caches the golangci-lint analysis directory the
        # other jobs don't use, which is why none of them falls back to
        # this key. The reverse holds though: falling back to a sibling
        # gives this job their module and build cache without the lint
        # directory, which is incomplete rather than wrong, and better
        # than cold.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-golangci-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task lint:golangci

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:markdown

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:yaml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:actions

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:shell

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task lint:secrets

  # The shared reusable workflow pins addlicense itself and takes the file
  # set as complete "find" invocations, one per line. task lint:license
  # keeps the same invocation for local development, and AGENTS.md records
  # that the two are kept in step by hand. addlicense 1.2.0 skips .mts files
  # silently, so the last line checks them through a copy that ends in .ts.
  license:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-license.yaml@v0
    with:
      copyright-holder: Simon Ostendorf
      year: "2026"
      # Mirrors mise.toml's own pin, so the same addlicense runs locally
      # and in CI.
      addlicense-version: "1.2.0"
      find-commands: |
        find . -name "*.go" -not -path "./.claude/worktrees/*" -not -path "*/node_modules/*"
        find web/src -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) -not -path "*/node_modules/*" -not -path "*/dist/*"
        find web/scripts -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) -not -path "*/node_modules/*" -not -path "*/dist/*"
        find web/src web/scripts -name "*.mts" | while read -r f; do o=/tmp/mts/$f.ts; mkdir -p "${o%/*}"; cp "$f" "$o"; echo "$o"; done

  renovate-config:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate-config.yaml@v0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, example-build and test each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-test-
      - run: task build

  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Cache Go modules and build output
        # example:build compiles the example application, a go build run
        # just like the build job, and needs the same module and build
        # cache.
        #
        # Own key, since vet, build and test each cache a different module
        # set. A miss falls back to this job's own cache first, then to
        # the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-example-build-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-example-build-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-test-
      - run: task example:build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, build and example-build each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-test-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-example-build-
      - run: task test:go

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task test:scripts

  # The one job that installs the web/ dependencies for their own sake. pnpm 11 and later
  # refuse a locked version younger than the minimum release age. This job explains that
  # on the pull request. The install failure itself stays a failure. Only this job gets
  # write access to pull requests, the workflow default stays read only.
  web-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: Install the web dependencies and keep the log
        # The script sets pipefail, so the exit code is the install's, not tee's.
        run: bash .github/scripts/install-with-log.sh "$RUNNER_TEMP/web-install.log" task web:deps
      - name: Explain a minimum release age failure on the pull request
        # A fork pull request has no write token, so it is skipped without a message.
        if: >-
          failure() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/release-age-comment.sh "$RUNNER_TEMP/web-install.log"

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:lint

  web-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:format

  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:types

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - run: task web:e2e
