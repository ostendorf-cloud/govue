name: renovate

# Thin, per-repository trigger for this repository's own Renovate run,
# calling the organisation's shared "reusable-renovate.yaml" at a pinned
# tag. The cron below runs hourly, at minute 8. That is offset from the
# workflows repository's own schedule (minute 17) so the several repositories
# wired up to the same reusable workflow do not all hit GitHub Actions at the
# same minute.
#
# The "issues"/"pull_request_target" "edited" triggers exist so a human checking
# a Renovate rebase checkbox (on the Dependency Dashboard issue, or on a
# Renovate pull request) reacts within this run's CI time, instead of
# waiting for the next "schedule" tick. The anti-loop guard that keeps
# Renovate's own edits from retriggering this workflow lives inside
# "reusable-renovate.yaml" itself, as that reusable workflow's own
# job-level "if:", so this caller adds no condition of its own.
on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  # A pull request with a merge conflict starts no pull_request run, so a
  # rebase tick on it needs this trigger. It also covers clean pull requests.
  pull_request_target:
    types: [edited]
  # Renovate runs when the checks of a Renovate branch have finished. The
  # list names every workflow that runs checks on a pull request: a
  # workflow left out can leave a pending check, and Renovate then waits
  # for the next scheduled tick.
  workflow_run:
    workflows: [checks, codeql, dco]
    types: [completed]
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  renovate:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate.yaml@v0
    secrets: inherit
