name: dco

# This repository's enforcement of the Developer Certificate of Origin,
# delegating to the organisation's shared reusable workflow instead of
# keeping a second copy of the same job.
#
# "secrets: inherit" forwards GH_APP_SECURITY_PRIVATE_KEY, so the verdict
# is published as the security app's own check run. Without it the check
# still enforces through this job's own pass or fail status, the same
# degraded shape a pull request from a fork gets.
#
# The reusable workflow carries its own copy of the DCO script and its
# test. It resolves its own repository and commit from the job context,
# which reflects the ref the "uses:" line below pins, and checks that out
# instead of this repository's. So this repository keeps no local copy
# of the script.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-dco.yaml@f64e9f521dd9d66f0233cd8e8035c778b9567f0c # v0.1.1
    secrets: inherit
