name: dco

# This repository's enforcement of the Developer Certificate of Origin,
# delegating to the organisation's shared reusable workflow instead of
# keeping a second copy of the same job.
#
# "secrets: inherit" forwards GH_APP_SECURITY_PRIVATE_KEY, so the verdict
# is published as the security app's own check run. Without it the check
# still enforces through this job's own pass or fail status, the same
# degraded shape a pull request from a fork gets.
#
# scripts/check-dco.sh stays in this repository. The reusable workflow
# checks out the calling repository and runs ./scripts/check-dco.sh from
# it, so the script and its test are part of the contract.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-dco.yaml@v0.1.0
    secrets: inherit
