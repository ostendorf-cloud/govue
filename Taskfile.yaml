version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  build:
    desc: Compile every package
    cmds:
      - go build ./...

  test:go:
    desc: Go test
    cmds:
      - go test -race -count=1 ./...

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: build
      - task: test:go

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
