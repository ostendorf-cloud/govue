version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:shell:
    desc: Shell script lint
    cmds:
      - shellcheck -x .github/scripts/*.sh

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:license:
    desc: License header check for every Go and web source file
    cmds:
      # addlicense 1.2.0 knows .mjs but silently skips .mts, so a .d.mts file
      # is checked through a copy that ends in .ts.
      - |
        d=$(mktemp -d "${TMPDIR:-/tmp}/govue-mts.XXXXXX")
        trap 'rm -rf "$d"' EXIT
        for f in $(find web/src web/scripts -type f -name "*.mts" \
          -not -path "*/node_modules/*" -not -path "*/dist/*"); do
          mkdir -p "$d/$(dirname "$f")"
          cp "$f" "$d/$f.ts"
        done
        addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only \
          $(find . -name "*.go" -not -path "./.claude/worktrees/*" -not -path "*/node_modules/*") \
          $(find web/src web/scripts -type f \( -name "*.ts" -o -name "*.vue" -o -name "*.mjs" \) \
            -not -path "*/node_modules/*" -not -path "*/dist/*") \
          $(find "$d" -type f -name "*.ts")

  build:
    desc: Compile every package
    cmds:
      - go build ./...

  example:build:
    desc: Compile the example application that wires every Go package together
    cmds:
      - go build -o /dev/null ./example

  # Sites copy this target and the imagemagick pin of mise.toml. The PNG files are generated
  # output and committed, never edited by hand. Run it again whenever the SVG changes.
  # Variables: FAVICON_DIR holds favicon.svg and receives the PNG files, web/public in a site.
  favicon:generate:
    desc: Generate the favicon PNG files from favicon.svg
    vars:
      FAVICON_DIR: '{{.FAVICON_DIR | default "example/web/public"}}'
    cmds:
      - >-
        magick -background none -density 1200 {{.FAVICON_DIR}}/favicon.svg -resize 32x32
        -depth 8 -strip -define png:exclude-chunks=date,time {{.FAVICON_DIR}}/favicon-32x32.png
      # The touch icon is opaque: iOS fills transparent pixels with black.
      - >-
        magick -background white -density 1200 {{.FAVICON_DIR}}/favicon.svg -resize 180x180
        -alpha remove -alpha off -depth 8 -strip -define png:exclude-chunks=date,time
        {{.FAVICON_DIR}}/apple-touch-icon.png

  test:go:
    desc: Go test, including the PostgreSQL tests when GOVUE_TEST_DATABASE_URL is set
    cmds:
      # go test hides a skip unless -v is set, so the missing server is said here.
      - |
        if [ -z "${GOVUE_TEST_DATABASE_URL:-}" ]; then
          echo "WARNING: GOVUE_TEST_DATABASE_URL is not set." >&2
          echo "WARNING: the tests against a real PostgreSQL will be SKIPPED, not run." >&2
          echo "WARNING: start one with 'docker compose -f example/compose.yaml up -d postgres', see AGENTS.md." >&2
        fi
      - go test -race -count=1 ./...

  test:scripts:
    desc: Shell test of the token boundary in checks.yaml
    cmds:
      - bash .github/scripts/checks-workflow.test.sh

  # The web/ half. Every target below runs inside web/ and depends on web:deps,
  # so one of them on its own is enough in a fresh checkout and in CI.
  web:deps:
    desc: Install the web/ dependencies from the lockfile
    dir: web
    # Five targets depend on this one, so check would otherwise install five
    # times in a row. Once per task run is enough.
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the web/ package standalone
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:e2e:
    desc: Playwright E2E suite of the web/ package, against a real browser
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm exec playwright install --with-deps chromium
      - pnpm exec playwright test

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:shell
      - task: lint:secrets
      - task: lint:license
      - task: build
      - task: example:build
      - task: test:go
      - task: test:scripts
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format
