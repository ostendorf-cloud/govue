version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  lint:vet:
    desc: Go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  build:
    desc: Compile every package
    cmds:
      - go build ./...

  test:go:
    desc: Go test
    cmds:
      - go test -race -count=1 ./...

  # The web/ half. Every target below runs inside web/ and depends on web:deps,
  # so one of them on its own is enough in a fresh checkout and in CI.
  web:deps:
    desc: Install the web/ dependencies from the lockfile
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the web/ package standalone
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: build
      - task: test:go
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format
