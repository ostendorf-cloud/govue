version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - govet
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
