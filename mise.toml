# Every tool this repository needs, pinned. CI installs from this same file through
# mise-action, so local and CI run identical versions. Nothing is installed any other way.
[tools]
go = "1.27.4"
task = "3"
# The web/ package. pnpm is the package manager, so npm is never called directly, and the
# lockfile is written by the major pinned here.
node = "26"
pnpm = "12"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
golangci-lint = "2.15.0"
actionlint = "1"
# Lints the shell scripts under .github/scripts. actionlint also uses it for run: blocks.
shellcheck = "0.11.0"
# The shell test under .github/scripts reads checks.yaml with yq.
yq = "4.54.3"
markdownlint-cli2 = "0.24.1"
yamllint = "1"
gitleaks = "8"
# addlicense has no short name in the mise registry. It is the one entry here
# that needs the explicit aqua backend prefix to resolve.
"aqua:google/addlicense" = "1.2.0"
# imagemagick renders the favicon PNG files from the SVG, see the favicon:generate target.
# Pinned to the patch like every other tool here, because the generated bytes are committed.
imagemagick = "7.1.2_31"
