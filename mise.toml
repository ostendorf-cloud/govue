# Every tool this repository needs, pinned. CI installs from this same file through
# mise-action, so local and CI run identical versions. Nothing is installed any other way.
[tools]
go = "1.27.3"
task = "3"
# The web/ package. pnpm is the package manager, so npm is never called directly, and the
# lockfile is written by the major pinned here.
node = "26"
pnpm = "10"
# Pinned to the patch, not "2": a golangci-lint release is built against one Go patch and
# cannot read the stdlib export data of a newer one, so the two versions move together.
golangci-lint = "2.15.0"
actionlint = "1"
markdownlint-cli2 = "0.20"
yamllint = "1"
gitleaks = "8"
shellcheck = "0"
# jq parses the pull request commit JSON scripts/check-dco.sh reads, and
# builds the check run payload .github/workflows/dco.yaml posts.
jq = "1"
# addlicense has no short name in the mise registry, so it is pinned here
# through the aqua backend directly, like every other tool in this file.
"aqua:google/addlicense" = "1.2.0"
